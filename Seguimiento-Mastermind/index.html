<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f4038">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mastermind">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="img/icon-180.png">
<link rel="icon" href="img/icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<title>Seguimiento Mastermind</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Manrope:wght@400;500;600;700&display=swap">
<style>
/* Layout: app de bolsillo — barra inferior en celular, barra lateral + lista/detalle en computador. Fondo blanco, verde RIMAN como único acento. */
:root{
  color-scheme: light;
  --bg:#ffffff;
  --surface:#f5f7f5;
  --sage:#e7ede8;
  --line:#e2e7e3;
  --ink:#1f2a25;
  --muted:#66736c;
  --green:#2f4038;
  --green-2:#4c6a5b;
  --on-green:#ffffff;
  --cold:#5b8fb9;
  --warm:#d9a441;
  --hot:#c4553d;
  --ok:#3f7d5a;
  --warn:#a8701a;
  --warn-bg:#fbf3e4;
  --err:#a8432f;
  --err-bg:#f9ebe7;
  --font-display:"Marcellus","Cormorant Garamond",Georgia,serif;
  --font-body:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:14px;
}
*{box-sizing:border-box}
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--green)}
:focus-visible{outline:2px solid var(--green-2);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;text-wrap:balance}
.display{font-family:var(--font-display);font-weight:400;letter-spacing:.01em}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.small{font-size:13px}

/* Logos (tinta negra recortada, coloreada con máscara) */
.logo{display:block;background:var(--green);-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-size:contain;mask-size:contain;-webkit-mask-position:left center;mask-position:left center}
.logo.riman{-webkit-mask-image:url(img/riman.png);mask-image:url(img/riman.png);aspect-ratio:656/120}
.logo.kwam{-webkit-mask-image:url(img/kwam.png);mask-image:url(img/kwam.png);aspect-ratio:874/120;background:var(--ink)}
.logos{display:flex;align-items:center;gap:14px}
.logos .sep{width:1px;height:18px;background:var(--line)}

/* Shell */
#app{min-height:100%}
.shell{display:flex;min-height:100%}
.side{display:none}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:rgba(255,255,255,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.top .logos .logo.riman{height:15px}
.top .logos .logo.kwam{height:11px}
.content{padding:18px 16px 110px;width:100%;max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--bg);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
.tab{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);padding:6px 0;font-weight:600}
.tab svg{width:22px;height:22px}
.tab.on{color:var(--green)}
.tab.plus span.fab{width:46px;height:46px;border-radius:50%;background:var(--green);color:var(--on-green);display:grid;place-items:center;margin-top:-18px;box-shadow:0 6px 16px rgba(47,64,56,.28)}
.tab.plus span.fab svg{width:24px;height:24px}
.demo-badge{font-size:11px;font-weight:600;color:var(--warn);background:var(--warn-bg);border-radius:20px;padding:3px 10px;white-space:nowrap}

@media (min-width:900px){
  .side{display:flex;flex-direction:column;gap:26px;width:240px;flex:none;border-right:1px solid var(--line);padding:26px 18px;position:sticky;top:0;height:100vh;background:var(--bg)}
  .side .logo.riman{height:20px}
  .side .logo.kwam{height:13px}
  .side nav{display:flex;flex-direction:column;gap:4px}
  .side .nav{display:flex;align-items:center;gap:12px;border:0;background:none;padding:10px 12px;border-radius:10px;font-weight:600;color:var(--muted);text-align:left}
  .side .nav svg{width:20px;height:20px}
  .side .nav.on{background:var(--sage);color:var(--green)}
  .side .btn{margin-top:4px}
  .side .who{margin-top:auto;font-size:13px;color:var(--muted)}
  .tabbar{display:none}
  .top .logos{display:none}
  .content{padding:28px 32px 60px;max-width:1100px}
  .split{display:grid;grid-template-columns:minmax(300px,380px) 1fr;gap:24px;align-items:start}
  .split>.detail-pane{position:sticky;top:84px}
}

/* Buttons & inputs */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;border:1px solid var(--green);background:var(--green);color:var(--on-green);padding:12px 18px;font-weight:700;text-decoration:none;min-height:46px;text-align:center}
.btn.ghost{background:var(--bg);color:var(--green)}
.btn.soft{background:var(--sage);border-color:var(--sage);color:var(--green)}
.btn.wa{background:#1f8f55;border-color:#1f8f55}
.btn.block{width:100%}
.btn.sm{min-height:36px;padding:7px 12px;font-size:13px;border-radius:10px}
.btn.danger{background:var(--bg);border-color:var(--err);color:var(--err)}
.btn svg{width:18px;height:18px;flex:none}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row>.btn{flex:1 1 140px}
.btn-pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn-pair .btn{white-space:nowrap;min-height:50px}
.in::placeholder{color:var(--muted);opacity:.55}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--muted)}
.in{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:12px 14px;font-size:16px;color:var(--ink);min-height:46px}
.in:focus{border-color:var(--green-2);outline:none;box-shadow:0 0 0 3px var(--sage)}
textarea.in{min-height:120px;resize:vertical;line-height:1.45}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:7px 13px;font-size:13px;font-weight:600;color:var(--ink)}
.chip.on{background:var(--green);border-color:var(--green);color:var(--on-green)}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface);border-radius:12px;padding:4px;gap:4px}
.seg button{border:0;background:none;border-radius:9px;padding:9px;font-weight:700;color:var(--muted)}
.seg button.on{background:var(--bg);color:var(--green);box-shadow:0 1px 3px rgba(0,0,0,.08)}

.pw{position:relative;display:block}
.pw .in{padding-right:52px}
.pw-eye{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:44px;height:40px;border:0;background:none;color:var(--muted);display:grid;place-items:center;border-radius:10px}
.pw-eye svg{width:22px;height:22px}
.pw-eye .slash{display:none}
.pw-eye.on{color:var(--green)}
.pw-eye.on .slash{display:inline}
.sync{width:10px;height:10px;border-radius:50%;background:var(--ok);display:inline-block;transition:background .3s}
.sync.saving{background:var(--warm)}
.sync.off{background:var(--hot)}
.boot{min-height:100%;display:grid;place-items:center;padding:40px 16px}
.spin{width:28px;height:28px;border-radius:50%;border:3px solid var(--sage);border-top-color:var(--green);animation:sp 0.9s linear infinite;margin:18px auto 0}
@keyframes sp{to{transform:rotate(360deg)}}
/* Cards & lists */
.card{border:1px solid var(--line);border-radius:var(--r);padding:16px;background:var(--bg);display:flex;flex-direction:column;gap:12px}
.card.tint{background:var(--surface);border-color:transparent}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.sec-h h2{font-size:17px;font-weight:700}
.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.item{display:flex;align-items:center;gap:12px;padding:12px 14px;border:0;border-bottom:1px solid var(--line);background:var(--bg);width:100%;text-align:left}
.item:last-child{border-bottom:0}
.item.sel{background:var(--surface)}
.item .grow{flex:1;min-width:0}
.item .name{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .meta{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.av{width:38px;height:38px;border-radius:50%;background:var(--sage);color:var(--green);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.tdot{width:10px;height:10px;border-radius:50%;flex:none}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;border-radius:999px;padding:3px 9px;background:var(--sage);color:var(--green);white-space:nowrap}
.pill.hot{background:#f8e4df;color:var(--hot)}
.pill.cierre{background:var(--green);color:var(--on-green)}
.pill.plan{background:#eef0e6;color:#5d6431}
.empty{padding:22px;text-align:center;color:var(--muted);font-size:14px}

/* Hoy */
.hello h1{font-size:28px}
.alert{display:flex;gap:12px;align-items:flex-start;border-radius:var(--r);padding:14px;background:#fbefe9;color:#6f2f20}
.alert b{color:var(--hot)}
.task{border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.task>button.th{width:100%;display:flex;align-items:center;gap:12px;border:0;background:var(--bg);padding:14px;text-align:left}
.task .cnt{min-width:34px;height:34px;border-radius:10px;background:var(--green);color:var(--on-green);display:grid;place-items:center;font-weight:700}
.task .cnt.q{background:var(--warm);color:#fff}
.task .cnt.r{background:var(--sage);color:var(--green)}
.task .tt{flex:1;min-width:0}
.task .tt b{display:block}
.task .tt span{font-size:12.5px;color:var(--muted)}
.task .tb{border-top:1px solid var(--line);display:flex;flex-direction:column}
.task .tb .item{border-bottom:1px solid var(--line)}
.ask{display:flex;flex-direction:column;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.ask:last-child{border-bottom:0}
.ask .row .btn{flex:1 1 90px}

/* Embudo */
.funnel{display:flex;flex-direction:column;gap:6px}
.fr{display:grid;grid-template-columns:28px 1fr auto;align-items:center;gap:10px;border:0;background:none;padding:6px 4px;border-radius:10px;text-align:left;width:100%}
.fr.on{background:var(--surface)}
.fr .n{font-weight:700;color:var(--muted);text-align:center}
.fr .bw{display:flex;flex-direction:column;gap:4px;min-width:0}
.fr .bl{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fr .bar{height:12px;border-radius:6px;background:var(--surface);overflow:hidden}
.fr .bar i{display:block;height:100%;border-radius:6px;background:var(--green-2)}
.fr .c{font-weight:700;font-size:18px;min-width:30px;text-align:right}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--surface);border-radius:12px;padding:12px}
.stat b{display:block;font-size:22px}
.stat span{font-size:12px;color:var(--muted)}

/* Ficha */
.ficha-h{display:flex;gap:14px;align-items:center}
.ficha-h .av{width:52px;height:52px;font-size:17px}
.ficha-h h2{font-size:22px}
.steps{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.steps i{height:6px;border-radius:3px;background:var(--line)}
.steps i.d{background:var(--green-2)}
.steps i.c{background:var(--green)}
.stepcard{border:1.5px solid var(--green);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
.stepcard h3{font-size:19px}
.instr{background:var(--surface);border-radius:12px;padding:12px 14px;font-size:14px}
.instr ol{margin:6px 0 0;padding-left:20px}
.anchor-note{background:var(--sage);border-radius:12px;padding:10px 12px;font-size:13.5px;color:var(--green)}
.thermo{display:flex;flex-direction:column;gap:8px}
.thermo input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:12px;border-radius:6px;background:linear-gradient(90deg,var(--cold),var(--warm),var(--hot));outline:none}
.thermo input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:50%;background:var(--bg);border:3px solid var(--green);box-shadow:0 2px 6px rgba(0,0,0,.2)}
.thermo input[type=range]::-moz-range-thumb{width:24px;height:24px;border-radius:50%;background:var(--bg);border:3px solid var(--green)}
.thermo .tv{display:flex;justify-content:space-between;align-items:baseline}
.thermo .tv b{font-size:26px}
.reply{background:var(--surface);border-radius:12px;padding:12px 14px;font-size:14px;white-space:pre-wrap}
.rutina{border-radius:12px;border:1px solid var(--line);width:100%;height:auto}
.calc{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.calc div{background:var(--surface);border-radius:12px;padding:10px;text-align:center}
.calc b{display:block;font-size:17px}
.calc span{font-size:11.5px;color:var(--muted)}
.hist{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.back{border:0;background:none;color:var(--green);font-weight:700;padding:0;display:inline-flex;align-items:center;gap:4px}

/* Sheet / modal */
.sheet-bg{position:fixed;inset:0;background:rgba(20,28,24,.4);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:20px 16px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
@media (min-width:700px){.sheet-bg{align-items:center}.sheet{border-radius:20px;padding:24px}}
.sheet h2{font-size:20px}
.warn{background:var(--warn-bg);color:#6e4a10;border-radius:12px;padding:10px 12px;font-size:13.5px}
.err{background:var(--err-bg);color:#6e2a1d;border-radius:12px;padding:10px 12px;font-size:13.5px}
.okb{background:var(--sage);color:var(--green);border-radius:12px;padding:10px 12px;font-size:13.5px}
.guide{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;background:var(--surface);border-radius:12px;padding:12px}
.phone-mini{width:64px;border:2px solid var(--ink);border-radius:12px;padding:6px 5px;display:flex;flex-direction:column;align-items:center;gap:4px;background:var(--bg)}
.phone-mini i{display:block;width:26px;height:26px;border-radius:50%;background:var(--sage)}
.phone-mini b{display:block;width:40px;height:5px;border-radius:3px;background:var(--ink)}
.phone-mini s{display:block;width:32px;height:4px;border-radius:2px;background:var(--green-2)}
.progress{height:6px;border-radius:3px;background:var(--surface);overflow:hidden}
.progress i{display:block;height:100%;background:var(--green-2);transition:width .3s}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:40;max-width:calc(100% - 32px);text-align:center}
@media (min-width:900px){.toast{bottom:28px}}

/* Tutorial */
.tut-bg{position:fixed;inset:0;z-index:30;background:rgba(20,28,24,.45);display:flex;align-items:stretch;justify-content:center}
.tut{background:var(--bg);width:100%;max-width:520px;display:flex;flex-direction:column;gap:14px;padding:calc(18px + env(safe-area-inset-top,0px)) 18px calc(18px + env(safe-area-inset-bottom,0px));overflow:hidden}
@media (min-width:700px){.tut-bg{align-items:center}.tut{border-radius:22px;max-height:88vh}}
.tut-dots{display:flex;gap:5px}
.tut-dots i{flex:1;height:4px;border-radius:2px;background:var(--line)}
.tut-dots i.on{background:var(--green)}
.tut-body{flex:1;overflow:auto;display:flex;flex-direction:column;gap:14px;padding-bottom:6px}
.tut-ic{width:54px;height:54px;border-radius:16px;background:var(--sage);color:var(--green);display:grid;place-items:center}
.tut-ic svg{width:28px;height:28px}
.tut h2{font-size:26px;line-height:1.2}
.tut-d{margin:0;font-size:16px;color:var(--ink)}
.tut-steps{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:9px;font-size:15px}
.tut-steps li::marker{font-weight:700;color:var(--green)}
.tut-demo{background:var(--surface);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px}
.tut-fab{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--green);color:#fff;vertical-align:-6px}
.tut-fab svg{width:15px;height:15px}
/* Auth & test (pantallas completas de marca) */
.brand-page{min-height:100%;display:flex;flex-direction:column;align-items:center;padding:28px 16px 40px;background:linear-gradient(180deg,var(--sage) 0,var(--bg) 300px)}
.brand-page .logos{justify-content:center;gap:18px;margin:10px 0 26px}
.brand-page .logo.riman{height:24px}
.brand-page .logo.kwam{height:15px}
.brand-page .logos .sep{height:24px}
.panel{width:100%;max-width:440px;display:flex;flex-direction:column;gap:14px}
.panel h1{font-size:30px;text-align:center}
.panel .lead{text-align:center;color:var(--muted)}
.linkbtn{border:0;background:none;color:var(--green);font-weight:700;padding:4px}
.opt{width:100%;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:14px;padding:15px 16px;font-weight:600;font-size:15.5px}
.opt:hover{border-color:var(--green-2)}
.opt.on{border-color:var(--green);background:var(--sage);color:var(--green)}
.q{font-size:24px;line-height:1.25}
.final{text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center;padding-top:10px}
.final .seal{width:74px;height:74px;border-radius:50%;background:var(--green);display:grid;place-items:center;color:#fff}
.final .seal svg{width:34px;height:34px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>


<div id="app"></div>
<div id="sheet-root"></div>
<div id="tut-root"></div>
<div id="toast-root"></div>

<script src="vendor/supabase.js"></script>
<script src="vendor/tesseract.min.js"></script>
<script>
/* ============ Utilidades ============ */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today = () => { const d=new Date(); d.setHours(0,0,0,0); return d; };
const iso = d => { const x=new Date(d); return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0'); };
const TODAY = iso(today());
const addDays = (s,n) => { const d=new Date(s+'T00:00:00'); d.setDate(d.getDate()+n); return iso(d); };
const fmtDate = s => { if(!s) return ''; const d=new Date(s+'T00:00:00'); return d.toLocaleDateString('es',{weekday:'short',day:'numeric',month:'short'}); };
const initials = n => (n||'?').trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase();
const uid = () => { try{ if(crypto.randomUUID) return crypto.randomUUID(); }catch(e){} return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,ch=>{ const r=Math.random()*16|0; return (ch==='x'?r:(r&3|8)).toString(16); }); };
const isUUID = s => /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(s||'');
const store = {
  get(k,d){ try{ const v=localStorage.getItem('sm_'+k); return v?JSON.parse(v):d; }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem('sm_'+k,JSON.stringify(v)); }catch(e){} }
};
function toast(msg){ const r=$('#toast-root'); r.innerHTML=`<div class="toast">${esc(msg)}</div>`; clearTimeout(toast.t); toast.t=setTimeout(()=>r.innerHTML='',2600); }
function copyText(t){
  try{ navigator.clipboard.writeText(t).then(()=>toast('Copiado'),()=>fallbackCopy(t)); }catch(e){ fallbackCopy(t); }
}
function fallbackCopy(t){ const ta=document.createElement('textarea'); ta.value=t; document.body.appendChild(ta); ta.select(); try{document.execCommand('copy'); toast('Copiado');}catch(e){toast('Mantén presionado el texto para copiarlo');} ta.remove(); }

function scoreQuiz(ans){
  const s={seca:0,normal:0,mixta:0,grasa:0,sens:0,acne:0,manchas:0};
  ans.forEach((a,i)=>{ const pts=QUIZ[i].o[a][1]; for(const k in pts) s[k]+=pts[k]; });
  if(s.sens>=3) return 'sensible';
  if(s.acne>=3) return 'acneica';
  if(s.manchas>=3) return 'manchas';
  return ['mixta','normal','seca','grasa'].reduce((b,k)=>s[k]>s[b]?k:b,'mixta');
}

function save(){
  if(S.mode==='demo'){ store.set('user',S.user); store.set('links',S.links); store.set('contacts',S.contacts); return; }
  if(S.uid){ store.set('cache_'+S.uid,{user:S.user,contacts:S.contacts}); }

}
function setSync(st){ S.sync=st; const el=document.getElementById('syncdot'); if(el){ el.className='sync '+st; el.title=st==='ok'?'Guardado en la nube':st==='saving'?'Guardando…':'Sin conexión: se guardará al volver'; } }
async function syncNow(){
  if(S.mode!=='cloud'||!sb||!S.uid) return;
  if(syncing){ clearTimeout(syncTimer); syncTimer=setTimeout(syncNow,800); return; }
  syncing=true;
  const cur={}; S.contacts.forEach(c=>{ cur[c.id]=JSON.stringify(c); });
  const up=[]; for(const id in cur){ if(SYNCED[id]!==cur[id]) up.push({id,owner:S.uid,data:JSON.parse(cur[id]),actualizado:new Date().toISOString()}); }
  const del=Object.keys(SYNCED).filter(id=>!(id in cur));
  if(!up.length && !del.length){ syncing=false; setSync('ok'); return; }
  setSync('saving');
  try{
    if(up.length){ const {error}=await sb.from('seg_contactos').upsert(up); if(error) throw error; up.forEach(r=>SYNCED[r.id]=cur[r.id]); }
    if(del.length){ const {error}=await sb.from('seg_contactos').delete().in('id',del); if(error) throw error; del.forEach(id=>delete SYNCED[id]); }
    setSync('ok');
  }catch(e){ console.warn('sync',e); setSync('off'); clearTimeout(syncTimer); syncTimer=setTimeout(syncNow,8000); }
  syncing=false;
}
async function loadCloud(user){
  S.uid=user.id;
  const cache=store.get('cache_'+S.uid,null);
  if(cache){ S.user=cache.user; S.contacts=cache.contacts||[]; }
  const [pf,ct,aj]=await Promise.all([
    sb.from('seg_perfiles').select('*').eq('id',S.uid).maybeSingle(),
    sb.from('seg_contactos').select('id,data').order('actualizado',{ascending:true}),
    sb.from('seg_ajustes').select('valor').eq('clave','links').maybeSingle()
  ]);
  if(pf.error && ct.error && !cache) throw pf.error;
  const p=pf.data, md=user.user_metadata||{};
  S.user={nombre:(p&&p.nombre)||md.nombre||(user.email||'').split('@')[0],apellido:(p&&p.apellido)||md.apellido||'',email:user.email,pais:(p&&p.pais)||md.pais||'CL',admin:!!(p&&p.es_admin)};
  if(!ct.error){
    const server=(ct.data||[]).map(r=>Object.assign({},r.data,{id:r.id}));
    SYNCED={}; server.forEach(c=>SYNCED[c.id]=JSON.stringify(c));
    // conserva lo creado sin conexión que aún no subió
    const ids=new Set(server.map(c=>c.id));
    const pending=(cache&&cache.contacts||[]).filter(c=>!ids.has(c.id)&&!c._synced);
    S.contacts=server.concat(pending);
  }
  if(aj.data&&aj.data.valor) S.links=Object.assign({},DEFAULT_LINKS,aj.data.valor);
  store.set('links',S.links);
  save();
}
async function refreshCloud(){
  if(S.mode!=='cloud'||!sb||!S.uid||syncing) return;
  const {data,error}=await sb.from('seg_contactos').select('id,data');
  if(error||!data) return;
  let changed=false;
  data.forEach(r=>{
    const srv=Object.assign({},r.data,{id:r.id}), js=JSON.stringify(srv);
    const i=S.contacts.findIndex(c=>c.id===r.id);
    const local=i>=0?JSON.stringify(S.contacts[i]):null;
    if(SYNCED[r.id]!==js && (i<0 || local===SYNCED[r.id])){ if(i>=0) S.contacts[i]=srv; else S.contacts.push(srv); SYNCED[r.id]=js; changed=true; }
  });
  if(changed){ store.set('cache_'+S.uid,{user:S.user,contacts:S.contacts}); if(!S.testFor&&!NEW&&!EDIT&&!document.activeElement.matches('input,textarea')) render(); }
}

  if(/Email not confirmed/i.test(m)) return 'Tu correo aún no está confirmado.';
  if(/Failed to fetch|NetworkError|network/i.test(m)) return 'No hay conexión a internet. Revisa tu señal e inténtalo de nuevo.';
  return 'No se pudo completar. '+m;
};

/* ============ Lógica de seguimiento ============ */
const tempColor = t => t>=70 ? 'var(--hot)' : t>=40 ? 'var(--warm)' : 'var(--cold)';
const tempLabel = t => t>=80 ? 'Muy caliente' : t>=60 ? 'Caliente' : t>=40 ? 'Tibio' : 'Frío';
const byId = id => S.contacts.find(c=>c.id===id);
function log(c,t){ c.hist=c.hist||[]; c.hist.unshift({f:TODAY,t}); }

function status(c){
  if(c.estado!=='activo') return {k:'none'};
  if(c.desde && c.desde>TODAY) return {k:'later'};
  const st=step(c);
  if(isLive(st) && c.agenda){
    if(c.agenda.fecha===TODAY) return {k:'meet'};
    if(c.agenda.fecha<TODAY) return {k:'held'};
    return {k:'upcoming'};
  }
  if(c.sent){
    if(c.sent>=TODAY) return {k:'waiting'};
    if(c.espera){ return c.espera<=TODAY ? {k:'reconnect'} : {k:'later'}; }
    return {k:'ask'};
  }
  return {k:'todo'};
}
function hot(c){ return c.estado==='activo' && c.temp>=80 && c.paso<CIERRE[c.tipo]; }

function advance(c){
  if(c.paso>=7){ c.estado='cerrado'; log(c,'Marcado como cerrado'); toast(c.nombre.split(' ')[0]+' terminó la secuencia'); }
  else { c.paso++; log(c,'Avanzó al paso '+c.paso); }
  c.sent=null; c.espera=null; c.agenda=null; c.desde=null;
}
function fill(tpl,c,extra={}){
  const ag=c.agenda||{};
  const testLink = location.href.split('#')[0].split('?')[0]+'?test='+c.id+'&n='+encodeURIComponent(c.nombre.split(' ')[0]);
  return tpl.replace(/\{(\w+)\}/g,(m,k)=>{
    if(k==='n') return c.nombre.split(' ')[0];
    if(k==='piel') return c.piel?SKIN[c.piel].n.toLowerCase():'tu tipo de piel';
    if(k==='fecha') return ag.fecha?fmtDate(ag.fecha):'[día]';
    if(k==='hora') return ag.hora||'[hora]';
    if(k==='zoom') return ag.zoom?('Link: '+ag.zoom):'';
    if(k==='test') return testLink;
    if(k in S.links) return S.links[k];
    return extra[k]??m;
  }).trim();
}
function waHref(c,text){
  const digits=(c.tel||'').replace(/\D/g,'');
  return 'https://wa.me/'+(digits||'')+'?text='+encodeURIComponent(text);
}

/* ---- Hoy ---- */
function viewHoy(){
  const act=S.contacts.filter(c=>c.estado==='activo');
  const groups={}, asks=[], recon=[], meets=[], held=[], upcoming=[];
  act.forEach(c=>{
    const s=status(c).k;
    if(s==='todo'){ const st=step(c); const key=c.tipo+'|'+c.paso; (groups[key]=groups[key]||{c:c.tipo,p:c.paso,st,list:[]}).list.push(c); }
    else if(s==='ask') asks.push(c);
    else if(s==='reconnect') recon.push(c);
    else if(s==='meet') meets.push(c);
    else if(s==='held') held.push(c);
    else if(s==='upcoming') upcoming.push(c);

  const total=gl.reduce((n,g)=>n+g.list.length,0)+asks.length+recon.length+meets.length+held.length;
  const verb = st => st.kind==='test'?'Enviar test de piel':isLive(st)?'Agendar: '+st.t:st.kind==='obj'?'Identificar objeción':st.kind==='reco'?'Enviar recomendación':'Enviar: '+st.t;

  };
  let h=`<section class="hello"><div class="eyebrow">${new Date().toLocaleDateString('es',{weekday:'long',day:'numeric',month:'long'})}</div>
    <h1 class="display">Hola, ${esc(S.user.nombre)}</h1>
    <p class="muted" style="margin:4px 0 0">${total?`Hoy tienes <b class="num" style="color:var(--ink)">${total}</b> ${total===1?'acción':'acciones'} de seguimiento.`:'Estás al día. Agrega nuevos prospectos después de tus demostraciones.'}</p></section>`;
  if(hots.length) h+=`<div class="alert"><span style="font-size:20px" aria-hidden="true">🔥</span><div><b>${hots.length} ${hots.length===1?'prospecto caliente':'prospectos calientes'}</b> (80% o más). Podrías llevarlos directo al cierre.<div class="chips" style="margin-top:8px">${hots.map(c=>`<button class="chip" data-act="open" data-id="${c.id}">${esc(c.nombre.split(' ')[0])} · ${c.temp}%</button>`).join('')}</div></div></div>`;
  if(meets.length) h+=taskBlock('meet',meets.length,'','Reuniones de hoy','Revisa la ficha antes de conectarte',meets.map(c=>contactRow(c,`<span class="pill">${esc(c.agenda.hora)}</span>`)).join(''));
  if(asks.length) h+=taskBlock('ask',asks.length,'q','¿Te respondieron?','Un toque por persona para saber qué sigue',asks.map(c=>`<div class="ask"><div class="row" style="justify-content:space-between"><b>${esc(c.nombre)}</b><span class="muted small">Paso ${c.paso} · enviado ${fmtDate(c.sent)}</span></div><div class="row"><button class="btn sm" data-act="resp" data-r="si" data-id="${c.id}">Sí respondió</button><button class="btn sm soft" data-act="resp" data-r="aun" data-id="${c.id}">Aún no</button><button class="btn sm ghost" data-act="resp" data-r="no" data-id="${c.id}">No le interesa</button></div></div>`).join(''));
  if(held.length) h+=taskBlock('held',held.length,'q','¿Se realizó la reunión?','Confírmalo para avanzar',held.map(c=>`<div class="ask"><div class="row" style="justify-content:space-between"><b>${esc(c.nombre)}</b><span class="muted small">${esc(step(c).t)} · ${fmtDate(c.agenda.fecha)}</span></div><div class="row"><button class="btn sm" data-act="held" data-r="si" data-id="${c.id}">Sí, avanzar</button><button class="btn sm soft" data-act="held" data-r="re" data-id="${c.id}">Reagendar</button></div></div>`).join(''));
  if(recon.length) h+=taskBlock('recon',recon.length,'r','Reconectar','No respondieron hace 2 días: un mensaje suave',recon.map(c=>contactRow(c)).join(''));
  gl.forEach(g=>{ const id='g'+g.c+g.p; h+=taskBlock(id,g.list.length,'',verb(g.st),(g.c==='cliente'?'Clientes':'Planners')+' · paso '+g.p+(g.st.cierre?' · cierre':''),g.list.map(c=>contactRow(c)).join('')); });
  if(upcoming.length) h+=`<section class="card tint"><div class="sec-h"><h2>Próximas reuniones</h2></div>${upcoming.sort((a,b)=>a.agenda.fecha.localeCompare(b.agenda.fecha)).map(c=>`<div class="row" style="justify-content:space-between"><span>${esc(c.nombre)} <span class="muted small">· ${esc(step(c).t)}</span></span><span class="pill num">${fmtDate(c.agenda.fecha)} ${esc(c.agenda.hora)}</span></div>`).join('')}</section>`;

  <section class="card tint"><span class="eyebrow">Acciones</span><div class="row">
    ${c.paso>1&&c.estado==='activo'?`<button class="btn sm ghost" data-act="prev" data-id="${c.id}">← Paso anterior</button>`:''}
    ${c.estado==='activo'?`<button class="btn sm" data-act="estado" data-v="cerrado" data-id="${c.id}">Marcar cerrado ✓</button><button class="btn sm soft" data-act="estado" data-v="pausa" data-id="${c.id}">Poner en pausa</button>`:''}
    <button class="btn sm danger" data-act="del" data-id="${c.id}">Eliminar</button></div>
    ${S.confirmDel===c.id?`<div class="err">¿Eliminar a ${esc(c.nombre)}? Esto no se puede deshacer.<div class="row" style="margin-top:8px"><button class="btn sm danger" data-act="delok" data-id="${c.id}">Sí, eliminar</button><button class="btn sm ghost" data-act="delno">Cancelar</button></div></div>`:''}</section>
  ${c.hist&&c.hist.length?`<section class="hist"><span class="eyebrow">Historial</span>${c.hist.slice(0,8).map(x=>`<span>${fmtDate(x.f)} · ${esc(x.t)}</span>`).join('')}</section>`:''}
  </div>`;
  return h;
}
function stepCard(c,st,s){
  const ancla = c.ancla?`<div class="anchor-note"><b>Recuerda:</b> ${esc(c.ancla)}</div>`:'';
  let state='';
  if(s==='later'&&c.desde) state=`<div class="okb">Siguiente acción disponible el ${fmtDate(c.desde)}.</div>`;
  if(s==='waiting') state=`<div class="okb">Enviado hoy. Mañana te preguntaré si respondió.</div>`;
  if(s==='ask') state=`<div class="warn"><b>¿${esc(c.nombre.split(' ')[0])} respondió?</b><div class="row" style="margin-top:8px"><button class="btn sm" data-act="resp" data-r="si" data-id="${c.id}">Sí</button><button class="btn sm soft" data-act="resp" data-r="aun" data-id="${c.id}">Aún no</button><button class="btn sm ghost" data-act="resp" data-r="no" data-id="${c.id}">No le interesa</button></div></div>`;
  if(s==='later'&&c.espera) state=`<div class="okb">Esperando respuesta. Te recordaré reconectar el ${fmtDate(c.espera)}.</div>`;
  if(s==='held') state=`<div class="warn"><b>¿Se realizó la reunión del ${fmtDate(c.agenda.fecha)}?</b><div class="row" style="margin-top:8px"><button class="btn sm" data-act="held" data-r="si" data-id="${c.id}">Sí, avanzar</button><button class="btn sm soft" data-act="held" data-r="re" data-id="${c.id}">Reagendar</button></div></div>`;
  const reconnect = s==='reconnect';
  const tpl = reconnect ? RECONNECT : st.msg;
  const msgBox = tpl ? `<label class="f">Mensaje (puedes editarlo)<textarea class="in" id="msg" data-id="${c.id}">${esc(fill(tpl,c))}</textarea></label>
     <div class="btn-pair"><a class="btn wa" id="wa" href="${esc(waHref(c,fill(tpl,c)))}" target="_blank" rel="noopener" data-act="sent" data-id="${c.id}" data-re="${reconnect?1:0}">${IC.wa}WhatsApp</a><button class="btn ghost" data-act="copymsg">${IC.copy}Copiar</button></div>` : '';
  let body='';
  if(st.instr) body+=`<div class="instr"><b>Qué hacer:</b> ${esc(st.instr)}${c.tipo==='cliente'&&c.paso===1?` <a href="${esc(S.links.academia)}" target="_blank" rel="noopener">Abrir Academia K-WAM</a>`:''}</div>`;
  if(st.kind==='test') body+=`<div class="instr">El prospecto responde 7 preguntas desde su celular. Al terminar, su tipo de piel aparece aquí y queda listo el paso 4.</div><button class="btn soft" data-act="test" data-id="${c.id}">Ver el test como lo ve ${esc(c.nombre.split(' ')[0])}</button>`;
  if(st.kind==='reco'){
    if(!c.piel) body+=`<div class="warn">Aún no sabemos su tipo de piel. Pídele que responda el test, o elígelo abajo en "Tipo de piel".</div>`;
    else body+=`<img class="rutina" src="${SKIN[c.piel].img}" alt="Rutina ICD para ${esc(SKIN[c.piel].n)}"><button class="btn soft" data-act="shareimg" data-id="${c.id}">Compartir imagen de la rutina</button>`;
  }
  if(isLive(st)) body+=agendaForm(c,st);
  if(st.kind==='zoom') body+=zoomGuide(c);
  if(st.kind==='obj') body+=`<div class="instr">Pregunta con calma qué le impide decidir. Marca la objeción en la sección <b>Objeción</b> de más abajo y usa la respuesta sugerida. Cuando la resuelvas, avanza al paso 7.</div><button class="btn" data-act="adv" data-id="${c.id}">Objeción trabajada → Paso 7</button>`;
  return `<section class="stepcard"><div class="row" style="justify-content:space-between"><span class="eyebrow">Paso ${c.paso} · ${reconnect?'Reconectar':'Acción de hoy'}</span>${st.cierre?'<span class="pill cierre">Cierre</span>':''}</div>
    <h3 class="display">${esc(st.t)}</h3>${state}${ancla}${body}${(isLive(st)&&!c.agenda)?'':msgBox}
    ${s==='todo'&&!isLive(st)&&st.kind!=='obj'?`<button class="linkbtn small" style="align-self:flex-start" data-act="adv" data-id="${c.id}">Saltar al paso siguiente →</button>`:''}</section>`;
}
function agendaForm(c,st){
  const a=c.agenda||{};
  return `<div class="card tint" style="gap:10px"><span class="eyebrow">${c.agenda?'Reunión agendada':'Agenda la reunión'}</span>
    <div class="row" style="gap:8px"><label class="f" style="flex:1 1 140px">Día<input class="in" type="date" id="ag_f" value="${esc(a.fecha||'')}"></label><label class="f" style="flex:1 1 110px">Hora<input class="in" type="time" id="ag_h" value="${esc(a.hora||'')}"></label></div>

function money(v){
  const cur=country(S.user.pais)[3];

}
function calcHTML(t){ return `<div><b class="num">${t?money(t):'—'}</b><span>Total · 5 meses</span></div><div><b class="num">${t?money(t/5):'—'}</b><span>Al mes</span></div><div><b class="num">${t?money(t/150):'—'}</b><span>Al día</span></div>`; }

function itemForm(it,i){

  let note='';

  else if(it.fromShot){

    else if(!it.tel) note=`<div class="warn"><b>Falta el número.</b> Abre el perfil del contacto en WhatsApp y saca la captura ahí, o escríbelo abajo.</div>`;
    else if(!it.nombre) note=`<div class="warn"><b>A este contacto aún le falta el nombre.</b> Agrégalo en tus contactos y vuelve a subir la captura, o escríbelo aquí.${it.sug?` WhatsApp muestra el nombre de perfil <b>${esc(it.sug)}</b>. <button class="linkbtn small" data-act="usesug" data-i="${i}">Usarlo</button>`:''}</div>`;
    else note=`<div class="okb">✓ Contacto listo. Revisa que los datos estén bien.</div>`;
  }
  return `<div class="card" style="gap:10px">${it.thumb?`<img src="${it.thumb}" alt="" style="max-height:110px;width:auto;align-self:flex-start;border-radius:8px;border:1px solid var(--line)">`:''}${note}

    <div class="seg"><button class="${it.tipo==='cliente'?'on':''}" data-act="ntipo" data-i="${i}" data-v="cliente">Cliente</button><button class="${it.tipo==='planner'?'on':''}" data-act="ntipo" data-i="${i}" data-v="planner">Planner</button></div></div>`;
}

/* Normaliza teléfonos al formato internacional */
function normPhone(raw){
  if(!raw) return '';
  let s=raw.replace(/[^\d+]/g,'');
  if(!s) return '';
  const home=country(S.user.pais)[2];
  if(s.startsWith('00')) s='+'+s.slice(2);
  if(s.startsWith('+')) return '+'+s.slice(1).replace(/\D/g,'');
  s=s.replace(/\D/g,'');
  if(s.length>=11 && DIALS.some(d=>s.startsWith(d))) return '+'+s;
  return '+'+home+s.replace(/^0+/,'');
}
const UI_WORDS=/^(info|información|editar|buscar|audio|video|videollamada|llamar|llamada|pagar|notificaciones|multimedia|archivos|enlaces|docs|documentos|mensajes|temporales|cifrado|bloquear|reportar|denunciar|añadir|agregar|contacto|contactos|grupos|en común|visibilidad|favoritos|cancelar|compartir|ver todo|todo|hoy|ayer|en línea|escribiendo|última vez|estado|crear|nuevo|existente|guardar|privacidad|whatsapp|business|cuenta|empresa|empresarial|catálogo|chats|llamadas|novedades|comunidades|ajustes|silenciar|vaciar|exportar|elementos|destacados|mensajes destacados|seguridad|conexión|bloqueo|tema|fondo|añadir a favoritos|search|edit|mute|call|voice|share|add|block|report|contact info|disappearing messages|encryption|media|links)[\s.:]*$/i;
function parseOCR(text){
  const lines=text.split(/\n/).map(l=>l.replace(/[|•·©®]/g,' ').replace(/\s+/g,' ').trim()).filter(Boolean);
  let telIdx=-1, tel='';
  const cand=[];
  lines.forEach((l,i)=>{
    const m=l.match(/\+?\(?\d[\d\s().-]{6,}\d/g);
    (m||[]).forEach(x=>{ const d=x.replace(/\D/g,''); if(d.length>=8&&d.length<=15&&!/\d{1,2}:\d{2}/.test(x)) cand.push({x,i,plus:x.trim().startsWith('+'),len:d.length}); });
  });
  cand.sort((a,b)=>(b.plus-a.plus)||(b.len-a.len));
  if(cand[0]){ tel=normPhone(cand[0].x); telIdx=cand[0].i; }
  const isName=l=>{ const letters=(l.match(/[A-Za-zÁÉÍÓÚÜÑáéíóúüñ]/g)||[]).length; const digits=(l.match(/\d/g)||[]).length; return letters>=2 && digits===0 && l.length<=40 && !UI_WORDS.test(l.replace(/^~\s*/,'')) && !/(info\.?|datos|detalles) del contacto|contact info|editar|perfil|whatsapp/i.test(l) && !/^[a-záéíóúñ]/.test(l.replace(/^~\s*/,'')) ; };
  let sug=''; const tl=lines.find(l=>/^~\s*\S/.test(l)); if(tl) sug=tl.replace(/^~\s*/,'').trim();
  let nombre='';
  if(telIdx>=0){
    for(let k=telIdx-1;k>=Math.max(0,telIdx-3);k--){ const l=lines[k]; if(isName(l)&&!l.startsWith('~')){ nombre=l; break; } }
    // si el título es el propio número (contacto no guardado), no hay nombre
    if(nombre && lines.slice(Math.max(0,telIdx-1),telIdx+1).some(l=>l.startsWith('~'))) nombre='';
  } else {
    const n=lines.find(l=>isName(l)&&!l.startsWith('~')&&l.split(' ').length<=4);
    if(n) nombre=n;
  }
  return {nombre:nombre.replace(/[^\p{L}\s'.-]/gu,'').trim(),tel,sug};
}
let ocrWorker=null, ocrWarm=null;
function warmOCR(){
  if(ocrWarm) return ocrWarm;
  if(!window.Tesseract) return Promise.reject(new Error('lector no disponible'));
  const base=location.href.split('#')[0].split('?')[0].replace(/[^/]*$/,'');
  ocrWarm=Tesseract.createWorker('spa',1,{
    workerPath:base+'vendor/worker-wrap.js',workerBlobURL:false,corePath:base+'vendor/core',langPath:base+'vendor/lang',
    logger:m=>{ if(m.status==='recognizing text'&&OCR_CB) OCR_CB(.35+m.progress*.65); else if(OCR_CB&&m.progress) OCR_CB(Math.min(.33,m.progress*.33)); }
  }).then(w=>ocrWorker=w).catch(e=>{ ocrWarm=null; throw e; });
  return ocrWarm;
}
let OCR_CB=null;
function prepImage(file){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file); const img=new Image();
    img.onload=()=>{ const scale=Math.min(1,1100/img.width); const cv=document.createElement('canvas'); cv.width=Math.round(img.width*scale); cv.height=Math.round(img.height*scale);
      const g=cv.getContext('2d'); g.fillStyle='#fff'; g.fillRect(0,0,cv.width,cv.height); g.drawImage(img,0,0,cv.width,cv.height);
      const t=document.createElement('canvas'); const ts=Math.min(1,220/cv.height); t.width=cv.width*ts; t.height=cv.height*ts; t.getContext('2d').drawImage(cv,0,0,t.width,t.height);
      URL.revokeObjectURL(url); res({canvas:cv,thumb:t.toDataURL('image/jpeg',.7)}); };
    img.onerror=()=>{ URL.revokeObjectURL(url); rej(new Error('imagen')); };
    img.src=url;
  });
}
async function handleShots(files){
  store.set('guide',true);
  NEW.mode='review';
  NEW.items=[...files].slice(0,10).map(()=>({busy:true,p:0,nombre:'',tel:'',tipo:'cliente',fromShot:true}));
  renderSheet();
  for(let i=0;i<files.length&&i<10;i++){
    const it=NEW.items[i];
    try{
      const {canvas,thumb}=await prepImage(files[i]); it.thumb=thumb;
      OCR_CB=p=>{ it.p=p; const bar=document.querySelectorAll('.sheet .progress i')[0]; if(bar) bar.style.width=Math.round(p*100)+'%'; };
      await warmOCR();
      const r=await ocrWorker.recognize(canvas);
      Object.assign(it,parseOCR(r.data.text||''));
    }catch(e){ it.ocrFail=true; }
    it.busy=false; if(!NEW) return; renderSheet();
  }
  OCR_CB=null;
}

      render(); return; }
    case 'savelinks': {
      const nl=Object.assign({},S.links); ['kiyosaki','pelicula','academia','lesbrown'].forEach(k=>{ const v=$('#l_'+k).value.trim(); if(v) nl[k]=v; });
      if(S.mode==='cloud'&&sb){ sb.from('seg_ajustes').upsert({clave:'links',valor:nl}).then(({error})=>{ if(error) toast('No se pudieron guardar los links.'); else { S.links=nl; store.set('links',nl); toast('Links actualizados para todo el equipo'); } }); }
      else { S.links=nl; save(); toast('Links guardados en este celular'); }
      return; }
    case 'cleardemo': S.contacts=S.contacts.filter(c=>!c.ej); S.sel=null; save(); toast('Ejemplos borrados'); render(); return;
    case 'reseed': S.contacts=S.contacts.filter(c=>!c.ej).concat(seed()); save(); toast('Ejemplos restaurados'); render(); return;
    case 'logout': {
      if(S.mode==='demo'){ S.user=null; store.set('user',null); store.set('mode',''); S.mode='cloud'; S.contacts=[]; AUTH='login'; render(); return; }
      syncNow().finally(async()=>{ try{ await sb.auth.signOut(); }catch(e){} S.user=null; S.uid=null; S.contacts=[]; SYNCED={}; AUTH='login'; S.view='hoy'; render(); });
      return; }
    case 'pw': { const inp=el.parentElement.querySelector('input'); const show=inp.type==='password'; inp.type=show?'text':'password'; el.classList.toggle('on',show); el.setAttribute('aria-label',show?'Ocultar contraseña':'Mostrar contraseña'); inp.focus(); return; }
    case 'tutopen': openTut(0); return;
    case 'tutnext': TUT.i++; renderTut(); return;
    case 'tutprev': TUT.i=Math.max(0,TUT.i-1); renderTut(); return;
    case 'tutclose': closeTut(); return;
    case 'tutos': TUT.os=el.dataset.v; renderTut(); return;
    case 'tutinstall': if(INSTALL_PROMPT){ INSTALL_PROMPT.prompt(); INSTALL_PROMPT.userChoice.finally(()=>{ INSTALL_PROMPT=null; renderTut(); }); } return;
    case 'auth': AUTH=el.dataset.v; render(); return;
    case 'demo': S.mode='demo'; store.set('mode','demo'); S.user={nombre:'Invitado',apellido:'',email:'demo@mastermind',pais:'CL'}; S.contacts=store.get('contacts',null)||seed(); save(); S.view='hoy'; render(); warmLater(); maybeTutorial(); return;
  }
});
document.addEventListener('submit',e=>{
  e.preventDefault();
  const f=e.target.id;
  const busy=(id,on,txt)=>{ const b=$('#'+id); if(b){ b.disabled=on; if(txt) b.textContent=txt; } };
  const noCloud=()=>!sb;
  if(f==='f_login'){
    if(noCloud()){ $('#l_err').innerHTML='<div class="err">No se pudo conectar. Revisa tu internet y recarga la página.</div>'; return; }
    busy('l_btn',true,'Entrando…'); $('#l_err').innerHTML='';
    sb.auth.signInWithPassword({email:$('#a_e').value.trim(),password:$('#a_p').value}).then(async({data,error})=>{
      if(error){ busy('l_btn',false,'Entrar'); $('#l_err').innerHTML=`<div class="err">${esc(authMsg(error))}</div>`; return; }
      await enterCloud(data.user);
    });
  }
  if(f==='f_reg'){
    if(noCloud()){ $('#r_err').innerHTML='<div class="err">No se pudo conectar. Revisa tu internet y recarga la página.</div>'; return; }
    busy('r_btn',true,'Creando cuenta…'); $('#r_err').innerHTML='';
    const meta={nombre:$('#r_n').value.trim(),apellido:$('#r_a').value.trim(),pais:$('#r_c').value,codigo:$('#r_k').value.trim().toUpperCase()};
    sb.auth.signUp({email:$('#r_e').value.trim(),password:$('#r_p').value,options:{data:meta}}).then(async({data,error})=>{
      if(!error && data && data.user && Array.isArray(data.user.identities) && data.user.identities.length===0) error={message:'User already registered'};
      if(error){ busy('r_btn',false,'Crear cuenta'); $('#r_err').innerHTML=`<div class="err">${esc(authMsg(error))}</div>`; return; }
      if(!data.session){ busy('r_btn',false,'Crear cuenta'); $('#r_err').innerHTML='<div class="okb">¡Cuenta creada! Revisa tu correo para confirmarla y luego entra con tu contraseña.</div>'; return; }
      await enterCloud(data.user); toast('¡Bienvenido, '+(S.user?S.user.nombre:'')+'!');
    });
  }
  if(f==='f_forgot'){
    if(noCloud()) return;
    const redirect=location.href.split('#')[0].split('?')[0];
    sb.auth.resetPasswordForEmail($('#fg_e').value.trim(),{redirectTo:redirect}).then(({error})=>{
      $('#fg_ok').innerHTML = error && /rate|too many/i.test(error.message||'') ? `<div class="err">${esc(authMsg(error))}</div>` : '<div class="okb">Si el correo está registrado, te llegará un link para crear una contraseña nueva. Revisa también tu carpeta de spam.</div>';
    });
  }
  if(f==='f_newpw'){
    sb.auth.updateUser({password:$('#np_p').value}).then(async({data,error})=>{
      if(error){ $('#np_err').innerHTML=`<div class="err">${esc(authMsg(error))}</div>`; return; }
      AUTH='login'; toast('Contraseña actualizada'); await enterCloud(data.user);
    });
  }
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='search'){ S.q=t.value; const L=filtered(); $('#clist').innerHTML=L.length?L.map(c=>contactRow(c)).join(''):'<div class="empty">No hay contactos con este filtro.</div>'; return; }
  if(t.id==='temp'){ const c=byId(t.dataset.id); c.temp=+t.value; $('#tval').textContent=c.temp+'%'; $('#tval').style.color=tempColor(c.temp); $('#tlab').textContent=tempLabel(c.temp); save(); return; }
  if(t.id==='ancla'){ byId(t.dataset.id).ancla=t.value; save(); return; }
  if(t.id==='objf'){ byId(t.dataset.id).objFrase=t.value; save(); return; }
  if(t.id==='msg'){ const c=byId(t.dataset.id); $('#wa').href=waHref(c,t.value); return; }
  if(t.id==='calc'){ const v=parseFloat(t.value.replace(/[^\d.,]/g,'').replace(/\.(?=\d{3}(\D|$))/g,'').replace(',','.'))||0; $('#calcout').innerHTML=calcHTML(v); const l=$('#calcline'); l.hidden=!v; if(v) l.textContent=`“Esta rutina te dura 5 meses. Son ${money(v/5)} al mes, es decir, ${money(v/150)} al día por la piel que quieres.”`; return; }
  if(t.dataset.ni!==undefined){ NEW.items[+t.dataset.ni][t.dataset.k]=t.value; return; }
});
document.addEventListener('change',e=>{
  if(e.target.id==='temp'){ const c=byId(e.target.dataset.id); log(c,'Termómetro en '+c.temp+'%'); save(); render(); }
  if(e.target.id==='shot' && e.target.files.length) handleShots(e.target.files);
});
document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ if(TUT!==null) closeTut(); else closeSheet(); } });

function finishQuiz(){
  if(S.testOnly){
    const piel=scoreQuiz(QZ.ans);
    if(sb && isUUID(S.testFor)) sb.rpc('seg_guardar_test',{p_id:S.testFor,p_piel:piel}).then(({error})=>{ if(error) console.warn(error); });
    return;
  }
  const c=byId(S.testFor); if(!c) return;
  c.piel=scoreQuiz(QZ.ans);
  log(c,'Respondió el test: '+SKIN[c.piel].n);
  if(c.estado==='activo' && c.tipo==='cliente' && c.paso===3){ c.paso=4; c.sent=null; c.espera=null; c.desde=addDays(TODAY,1); log(c,'Pasa a recomendación (mañana)'); }
  save();
}
async function shareImg(c){
  try{
    const blob=await (await fetch(SKIN[c.piel].img)).blob();
    const file=new File([blob],'rutina-'+c.piel+'.jpg',{type:'image/jpeg'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){ await navigator.share({files:[file],text:fill(step(c).msg,c)}); return; }
    throw 0;
  }catch(e){ toast('En la app final se comparte directo a WhatsApp. Por ahora, mantén presionada la imagen para guardarla.'); }
}
function warmLater(){ setTimeout(()=>{ warmOCR().catch(()=>{}); },1500); }
let lastWide=matchMedia('(min-width:900px)').matches;
addEventListener('resize',()=>{ const w=matchMedia('(min-width:900px)').matches; if(w!==lastWide){ lastWide=w; if(w&&S.view==='ficha') S.view='contactos'; render(); } });

/* Link del test: #test-<id> abre la vista del prospecto */
(function(){
  let p; try{ p=new URLSearchParams(location.search); }catch(e){ p=null; }
  if(p&&p.get('test')){ S.testFor=p.get('test'); S.testName=p.get('n')||''; S.testOnly=true; return; }
  const m=location.hash.match(/^#test-(\w+)$/); if(m&&S.user&&byId(m[1])){ S.testFor=m[1]; }
})();
async function enterCloud(user){
  S.mode='cloud'; store.set('mode','');
  try{ await loadCloud(user); }
  catch(e){ console.warn(e); S.user={nombre:(user.user_metadata&&user.user_metadata.nombre)||'',apellido:'',email:user.email,pais:'CL'}; toast('Sin conexión: mostrando tus datos guardados en este celular'); }
  S.booting=false; S.view='hoy'; render(); warmLater(); maybeTutorial();
}
(async function boot(){
  if(S.testOnly){ renderTest(); return; }
  if(S.mode==='demo'){ S.booting=false; render(); if(S.user){ warmLater(); maybeTutorial(); } return; }
  renderBoot();
  if(!sb){ S.booting=false; render(); return; }
  sb.auth.onAuthStateChange((ev,session)=>{
    if(ev==='PASSWORD_RECOVERY'){ AUTH='newpw'; S.user=null; S.booting=false; render(); }
  });
  let session=null;
  try{ const r=await sb.auth.getSession(); session=r.data&&r.data.session; }catch(e){}
  if(AUTH==='newpw') return;
  if(/type=recovery/.test(location.hash)){ AUTH='newpw'; S.booting=false; render(); return; }
  if(session&&session.user){ await enterCloud(session.user); }
  else { S.booting=false; render(); }
})();
</script>
